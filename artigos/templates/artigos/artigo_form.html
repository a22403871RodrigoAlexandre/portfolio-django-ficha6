{% extends "portfolio/base.html" %}

{% block content %}

<style>
    .form-card {
        background: var(--card); border: 1px solid var(--border);
        border-radius: 14px; padding: 2rem; max-width: 720px;
    }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label {
        display: block; font-size: 0.85rem; font-weight: 600;
        color: var(--muted); margin-bottom: 0.4rem;
    }
    .form-group input[type="text"],
    .form-group input[type="url"],
    .form-group textarea {
        width: 100%; padding: 0.7rem 1rem;
        background: rgba(255,255,255,0.05); border: 1px solid var(--border);
        border-radius: 8px; color: var(--text); font-family: inherit;
        font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
    .form-group input[type="file"] { color: var(--muted); font-size: 0.88rem; }
    .errorlist { list-style:none; padding:0; margin:0.3rem 0 0; }
    .errorlist li { font-size:0.8rem; color:#f87171; margin-top:0.2rem; }
    .btn-save {
        padding: 0.75rem 2rem; background: var(--accent); color: #fff;
        border: none; border-radius: 8px; font-family: inherit; font-size: 1rem;
        font-weight: 700; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-save:hover { opacity: 0.85; }
</style>

<div class="page-header">
    <div>
        <h2>{{ titulo }}<span>.</span></h2>
    </div>
    <a href="{% url 'artigos_list' %}" class="badge" style="text-decoration:none;">← Artigos</a>
</div>

<div class="form-card">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {% for field in form %}
        <div class="form-group">
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}{{ field.errors }}{% endif %}
            {% if field.help_text %}<small style="color:var(--muted); font-size:0.78rem;">{{ field.help_text }}</small>{% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="btn-save">Guardar</button>
    </form>
</div>

{% endblock %}
